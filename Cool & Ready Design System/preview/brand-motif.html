<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); }
  .stage { position: relative; height: 300px; background: var(--harbor-900); overflow: hidden; display: flex; align-items: center; }
  .stage .motif { position: absolute; inset: 0; background: url('../assets/soundings.svg') center/cover no-repeat; }
  .stage .fade { position: absolute; inset: 0; background: linear-gradient(90deg, var(--harbor-900) 8%, transparent 60%); }
  .copy { position: relative; padding: 0 40px; max-width: 520px; }
  .ov { text-transform: uppercase; letter-spacing: var(--tracking-overline); font-weight: 600; font-size: 12px; color: var(--tide-300); }
  h3 { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: -0.02em; color: #fff; margin: 12px 0 8px; }
  p { font-size: 14px; line-height: 1.6; color: var(--fg-on-dark-muted); margin: 0; }
  code { font-family: var(--font-mono); font-size: 12px; color: var(--tide-300); }
</style>
</head>
<body>
  <div class="stage">
    <div class="motif"></div>
    <div class="fade"></div>
    <div class="copy">
      <div class="ov">Brand motif</div>
      <h3>Soundings</h3>
      <p>Bathymetric depth-contour lines — the ocean-chart / sonar readout that ties the sea to cold-chain precision. A low-opacity texture for dark Harbor sections. <code>assets/soundings.svg</code></p>
    </div>
  </div>
</body>
</html>
