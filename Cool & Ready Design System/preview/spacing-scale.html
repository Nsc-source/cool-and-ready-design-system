<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--fg); padding: 24px; }
  .grp { font: var(--text-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--tide-500); font-weight: 600; margin: 0 0 14px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .bar { background: var(--tide-300); height: 16px; border-radius: 3px; }
  .tok { font-family: var(--font-mono); font-size: 12px; color: var(--fg); width: 92px; flex: none; }
  .px { font-family: var(--font-mono); font-size: 12px; color: var(--fg-subtle); }
</style>
</head>
<body>
  <div class="grp">Spacing · 4px base grid</div>
  <div class="row"><div class="tok">space-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
  <div class="row"><div class="tok">space-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
  <div class="row"><div class="tok">space-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
  <div class="row"><div class="tok">space-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
  <div class="row"><div class="tok">space-6</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
  <div class="row"><div class="tok">space-8</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
  <div class="row"><div class="tok">space-12</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
  <div class="row"><div class="tok">space-16</div><div class="bar" style="width:64px"></div><div class="px">64px · section</div></div>
  <div class="row"><div class="tok">space-24</div><div class="bar" style="width:96px"></div><div class="px">96px · section</div></div>
</body>
</html>
