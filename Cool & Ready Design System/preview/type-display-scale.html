<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--fg); padding: 24px; }
  .line { display: flex; align-items: baseline; gap: 16px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .line:last-child { border-bottom: 0; }
  .spec { font-family: var(--font-mono); font-size: 11px; color: var(--fg-subtle); width: 130px; flex: none; }
  .t { font-family: var(--font-display); letter-spacing: -0.02em; color: var(--fg); }
</style>
</head>
<body>
  <div class="line"><div class="spec">display · 68 / 700</div><div class="t" style="font-size:44px; font-weight:700">Shows up ready</div></div>
  <div class="line"><div class="spec">h1 · 48 / 700</div><div class="t" style="font-size:38px; font-weight:700">Seafood, on time</div></div>
  <div class="line"><div class="spec">h2 · 34 / 600</div><div class="t" style="font-size:30px; font-weight:600">One unbroken chain</div></div>
  <div class="line"><div class="spec">h3 · 24 / 600</div><div class="t" style="font-size:24px; font-weight:600">Browse the catalog</div></div>
  <div class="line"><div class="spec">h4 · 19 / 600</div><div class="t" style="font-size:19px; font-weight:600">Delivery windows</div></div>
</body>
</html>
