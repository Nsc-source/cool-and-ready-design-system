<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--fg); padding: 24px; }
  .grp { font: var(--text-caption); text-transform: uppercase; letter-spacing: var(--tracking-overline); color: var(--tide-500); font-weight: 600; margin: 0 0 16px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-sans); font-size: 15px; font-weight: 600; border-radius: var(--radius-md); padding: 11px 18px; border: 1px solid transparent; cursor: pointer; transition: all var(--dur) var(--ease-out); }
  .btn svg { width: 18px; height: 18px; }
  .primary { background: var(--primary); color: #fff; }
  .accent { background: var(--accent); color: #fff; }
  .secondary { background: var(--paper); color: var(--harbor-800); border-color: var(--border-strong); }
  .ghost { background: transparent; color: var(--harbor-800); }
  .disabled { background: var(--ink-200); color: var(--ink-400); cursor: not-allowed; }
  .sm { font-size: 13px; padding: 7px 12px; }
  .lab { font-size: 11px; color: var(--fg-subtle); width: 100%; }
</style>
</head>
<body>
  <div class="grp">Buttons</div>
  <div class="row">
    <button class="btn primary">Become a customer</button>
    <button class="btn accent"><i data-lucide="shopping-cart"></i>Start an order</button>
    <button class="btn secondary">View catalog</button>
    <button class="btn ghost">Learn more</button>
    <button class="btn disabled" disabled>Unavailable</button>
  </div>
  <div class="row">
    <button class="btn primary sm">Small</button>
    <button class="btn secondary sm"><i data-lucide="download"></i>Invoice</button>
    <button class="btn accent sm">Reorder</button>
    <span class="lab">Primary = Harbor · Accent = Marine blue (one per view) · Secondary = outline · Ghost = text</span>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
